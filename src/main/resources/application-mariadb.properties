# Perfil para MariaDB: se activa con  --spring.profiles.active=mariadb  (o SPRING_PROFILES_ACTIVE=mariadb)
# Los datos de conexión salen de variables de entorno; los valores por defecto coinciden con docker-compose.yml.
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/ecommerce}
spring.datasource.username=${DB_USER:ecommerce}
spring.datasource.password=${DB_PASSWORD:ecommerce}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# "update" crea o ajusta las tablas sin borrar los datos al reiniciar (con H2 se recrean cada vez)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Carga los datos de prueba y de demostración con INSERT IGNORE, así reiniciar no falla por claves duplicadas
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data-mariadb.sql,classpath:data-demo-mariadb.sql

# La consola de H2 no aplica con MariaDB
spring.h2.console.enabled=false