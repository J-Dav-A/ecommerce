spring.application.name=ecommerce

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# --- Base de datos H2 (en memoria) ---
spring.datasource.url=jdbc:h2:mem:ecommercedb
spring.datasource.username=sa
spring.datasource.password=

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false

# --- Consola web de H2 ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- JWT ---
# La clave puede sobrescribirse con la variable de entorno JWT_SECRET (recomendado fuera de desarrollo).
jwt.secret=${JWT_SECRET:claveSecretaSuperSeguraParaFirmarLosTokensJWTDelMarketplace123456}
# Duración del token en milisegundos (86400000 = 24 horas)
jwt.expiration=86400000

# --- Correo (por defecto solo se escribe en el log; poner CORREO_HABILITADO=true para enviar de verdad) ---
app.correo.habilitado=${CORREO_HABILITADO:false}
app.correo.remitente=${CORREO_REMITENTE:no-reply@ecommerce.local}
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USUARIO:}
spring.mail.password=${SMTP_CLAVE:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# --- Cloudinary (subida firmada de imagenes; si faltan, GET /api/archivos/firma responde 503) ---
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}